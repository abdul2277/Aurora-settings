<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:">
<title>Vorynth Launcher</title>
<style>
html,body{margin:0;background:transparent;font:15px system-ui,"Segoe UI",Ubuntu,sans-serif;color:#eef0f6;overflow:hidden;user-select:none}
#box{margin:6px;background:rgba(22,24,32,.96);border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.55);overflow:hidden}
#q{width:100%;box-sizing:border-box;background:transparent;border:0;outline:0;color:#fff;font-size:20px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
#list{max-height:480px;overflow-y:auto}
.g{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8b90a3;padding:8px 18px 3px}
.r{display:flex;align-items:center;gap:12px;padding:8px 18px;cursor:pointer}
.r.sel{background:rgba(124,92,255,.28)}
.ic{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:7px}
.ic img{width:26px;height:26px}
.t{flex:1;min-width:0}.t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t i{display:block;font-style:normal;font-size:12px;color:#9aa0b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.big .t b{font-size:22px}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid #fff4}
#foot{display:flex;justify-content:space-between;padding:7px 18px;font-size:11.5px;color:#8b90a3;border-top:1px solid rgba(255,255,255,.08)}
#msg{color:#9ee6b0}
#ai{padding:12px 18px;white-space:pre-wrap;font-size:14px;line-height:1.45;max-height:300px;overflow:auto;user-select:text}
</style></head><body>
<div id="box"><input id="q" placeholder="Search apps, files, commands. Try 5*12, 10 km to mi, cb, timer 5m" autocomplete="off" spellcheck="false">
<div id="list"></div><div id="foot"><span id="hint">↑↓ choose · Enter open · Ctrl+Enter other action · Esc close</span><span id="msg"></span></div></div>
<script src="launcher.js"></script></body></html>
